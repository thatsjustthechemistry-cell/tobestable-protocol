[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
# ts-mocha is unmaintained and breaks on modern mocha/Node: mocha loads .ts via
# its ESM path, so ts-mocha's CommonJS ts-node hook never applies and the
# extensionless `../target/types/neco_token` import fails with ERR_MODULE_NOT_FOUND.
# tsx handles TS under both ESM and CJS and resolves extensionless imports.
# mocha's own --import resolves the value as a FILE PATH (file:///.../tsx), not a
# bare package specifier, so `--import tsx` dies with ERR_MODULE_NOT_FOUND. Setting
# NODE_OPTIONS lets Node itself resolve `tsx` from node_modules correctly.
test = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 \"tests/**/*.ts\""

[test]
startup_wait = 60000

[test.validator]
bind_address = "127.0.0.1"
url = "https://api.mainnet-beta.solana.com"

