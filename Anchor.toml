# Legacy devnet deployment from Phase 1+2 verification (still live, but
# this build now targets mainnet — declare_id! changed). Redeploys to
# devnet would need: `anchor deploy --provider.cluster devnet
# --program-keypair target/deploy/neco_token-keypair.json` AND a code
# revert of declare_id!() to CfdXZe... — not recommended; devnet is done.
[programs.devnet]
neco_token = "CfdXZeKuFRGMxiedAHBemm35rANWPvcriwPEyh9KVnBQ"

[programs.mainnet]
neco_token = "Eekx6ftd6WZfSpubr9otS1G6wbKdSCWuXt7n1cbQjmdX"

[programs.testnet]
